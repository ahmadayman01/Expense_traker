<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-body">
    <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark ">
      <div class="container-fluid">
        <a class="navbar-brand text-white " href="#">Expense Tracker</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
          aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse " id="navbarNavAltMarkup">
          <div class="navbar-nav mx-auto ">
            <a class="nav-link active text-white" aria-current="page" href="#">Home</a>
            <a class="nav-link text-white " href="#addexpenses">Add Expenses</a>
            <a class="nav-link text-white " href="#expenses">Expenses</a>
          </div>
        </div>
        <button id="darkModeBtn" class="btn btn-outline-light">
        Dark
        </button>
      </div>
    </nav>

  </header>
  <main class="mt-6">

    <!-- Summary Cards -->
    <section class="mt-4">
      <div class="container text-center">
        <div class="summary-grid">

          <div class="">
            <div class="card h-100">
              <div class="card-body">
                <h5 class="card-title fw-light text-secondary">Total Amount</h5>
                <p class="fw-bold fs-3 text-success" id="totalAmount">$ 0.00</p>
              </div>
            </div>
          </div>

          <div class="">
            <div class="card h-100">
              <div class="card-body">
                <h5 class="card-title fw-light text-secondary">Number of expenses</h5>
                <p class="fw-bold fs-3" id="numberOfExpenses">0</p>
              </div>
            </div>
          </div>

          <div class="">
            <div class="card h-100">
              <div class="card-body">
                <h5 class="card-title fw-light text-secondary">Highest expense</h5>
                <p class="fw-bold fs-3 text-danger" id="highestExpense">$0.00</p>
                <h5 class="card-title fw-light text-secondary" id="highestcategory">...</h5>
              </div>
            </div>
          </div>

        </div>
      </div>
    </section>


    <!-- Add Expense -->
    <section class="mt-4" id="addexpenses">
      <div class="container">

        <div class="row">
          <div class="col-12">
            <div class="border rounded p-3 bg-body">
              <form action="">

                <h2 class="fs-4 text-secondary-emphasis">Add Expense</h2>

                <div class="row g-3 my-3">
                  <div class="col-md-4">
                    <label for="title" class="text-secondary d-block mb-1">Title</label>
                    <input type="text" id="title" class="form-control" required>
                  </div>
                  <div class="col-md-2">
                    <label for="amount" class="text-secondary d-block mb-1">Amount</label>
                    <input type="number" id="amount" class="form-control" step="0.01" required>
                  </div>
                  <div class="col-md-3">
                    <label for="category" class="text-secondary d-block mb-1">Category</label>
                    <select class="form-select" id="category">
                      <option value="Food">Food</option>
                      <option value="Transport">Transport</option>
                      <option value="Bills">Bills</option>
                      <option value="Entertainment">Entertainment</option>
                      <option value="Other">Other</option>
                    </select>
                  </div>
                  <div class="col-md-3">
                    <label for="date" class="text-secondary d-block mb-1">Date</label>
                    <input type="date" id="date" class="form-control" required>
                  </div>
                </div>
                <button type="submit" class="btn btn-primary mt-4">Add Expense</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- Expenses -->
    <section class="mt-4" id="expenses">
      <div class="container">
        <div class="row">
          <div class="col-12">
            <div class="border rounded p-3 bg-body">
              <div class="row align-items-center">
                <div class="col">
                  <h2 class="fs-4 text-secondary-emphasis">Expenses</h2>
                </div>
                <div class="col-auto d-flex align-items-center">
                  <label for="filterCategory" class="me-2">Category</label>
                  <select class="form-select " id="filterCategory">
                    <option value="All">All</option>
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Other">Other</option>
                  </select>
                </div>
                <form class="d-flex mt-3" role="search" id="searchForm">
                  <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" id="searchInput"/>
                  <button class="btn btn-outline-primary" type="submit">Search</button>
                </form>

              </div>
              <div class="expenses-scroll">

                <div class="row mt-3  ">
                  <div class="col-3 col-sm-3 fw-bold ">Title</div>
                  <div class="col-1 col-sm-2 fw-bold  text-end">Amount</div>
                  <div class="col-3 col-sm-3 fw-bold">Category</div>
                  <div class="col-3 col-sm-2 fw-bold">Date</div>
                  <div class="col-2 col-sm-2  fw-bold text-end">Actions</div>
                </div>
                <div id="skeletonLoading" class="d-none">

                  <div class="row mt-3 placeholder-glow" aria-hidden="true">

                    <div class="col-3 col-sm-3">
                      <span class="placeholder col-8"></span>
                    </div>

                    <div class="col-1 col-sm-2 text-end">
                      <span class="placeholder col-10"></span>
                    </div>

                    <div class="col-3 col-sm-3">
                      <span class="placeholder col-5"></span>
                    </div>

                    <div class="col-3 col-sm-2">
                      <span class="placeholder col-6"></span>
                    </div>

                    <div class="col-2 col-sm-2 text-end">
                      <span class="placeholder col-10"></span>
                    </div>

                  </div>


                  <div class="row mt-3 placeholder-glow" aria-hidden="true">

                    <div class="col-3 col-sm-3">
                      <span class="placeholder col-8"></span>
                    </div>

                    <div class="col-1 col-sm-2 text-end">
                      <span class="placeholder col-10"></span>
                    </div>

                    <div class="col-3 col-sm-3">
                      <span class="placeholder col-5"></span>
                    </div>

                    <div class="col-3 col-sm-2">
                      <span class="placeholder col-6"></span>
                    </div>

                    <div class="col-2 col-sm-2 text-end">
                      <span class="placeholder col-10"></span>
                    </div>

                  </div>


                  <div class="row mt-3 placeholder-glow" aria-hidden="true">

                    <div class="col-3 col-sm-3">
                      <span class="placeholder col-8"></span>
                    </div>

                    <div class="col-1 col-sm-2 text-end">
                      <span class="placeholder col-10"></span>
                    </div>

                    <div class="col-3 col-sm-3">
                      <span class="placeholder col-5"></span>
                    </div>

                    <div class="col-3 col-sm-2">
                      <span class="placeholder col-6"></span>
                    </div>

                    <div class="col-2 col-sm-2 text-end">
                      <span class="placeholder col-10"></span>
                    </div>

                  </div>


                  <div class="row mt-3 placeholder-glow" aria-hidden="true">

                    <div class="col-3 col-sm-3">
                      <span class="placeholder col-8"></span>
                    </div>

                    <div class="col-1 col-sm-2 text-end">
                      <span class="placeholder col-10"></span>
                    </div>

                    <div class="col-3 col-sm-3">
                      <span class="placeholder col-5"></span>
                    </div>

                    <div class="col-3 col-sm-2">
                      <span class="placeholder col-6"></span>
                    </div>

                    <div class="col-2 col-sm-2 text-end">
                      <span class="placeholder col-10"></span>
                    </div>

                  </div>


                  <div class="row mt-3 placeholder-glow" aria-hidden="true">

                    <div class="col-3 col-sm-3">
                      <span class="placeholder col-8"></span>
                    </div>

                    <div class="col-1 col-sm-2 text-end">
                      <span class="placeholder col-10"></span>
                    </div>

                    <div class="col-3 col-sm-3">
                      <span class="placeholder col-5"></span>
                    </div>

                    <div class="col-3 col-sm-2">
                      <span class="placeholder col-6"></span>
                    </div>

                    <div class="col-2 col-sm-2 text-end">
                      <span class="placeholder col-10"></span>
                    </div>

                  </div>


                  <div class="row mt-3 placeholder-glow" aria-hidden="true">

                    <div class="col-3 col-sm-3">
                      <span class="placeholder col-8"></span>
                    </div>

                    <div class="col-1 col-sm-2 text-end">
                      <span class="placeholder col-10"></span>
                    </div>

                    <div class="col-3 col-sm-3">
                      <span class="placeholder col-5"></span>
                    </div>

                    <div class="col-3 col-sm-2">
                      <span class="placeholder col-6"></span>
                    </div>

                    <div class="col-2 col-sm-2 text-end">
                      <span class="placeholder col-10"></span>
                    </div>

                  </div>

                </div>

                <div id="expensesBody"></div>

              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
    <div class="modal faid" id="editExpenseModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Edite expense</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="editTitle" class="from-label">Title</label>
              <input type="text" id="editTitle" class="form-control">
            </div>
            <div class="mb-3">
              <label for="editAmount" class="from-label" step="0.01">Amount</label>
              <input type="number" id="editAmount" class="form-control">
            </div>
            <div class="mb-3">
              <label for="editCategory" class="from-label">Category</label>
              <select class="form-select " id="editCategory">
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="editeDate" class="from-label">Date</label>
              <input type="date" id="editDate" class="form-control">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-primary" id="saveEditModal">Save</button>
          </div>
        </div>
      </div>
    </div>
  </main>
  <footer></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>

</html>
